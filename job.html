<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentGrid USA | Find Jobs & Career Paths in the United States</title>
    <style>
        :root {
            --primary: #1e3a8a; /* American Navy Blue */
            --accent: #b91c1c; /* Crimson Accent */
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #cbd5e1;
            --success: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.5;
        }

        /* Top Bar & Header Navigation */
        header {
            background-color: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        nav a {
            text-decoration: none;
            color: #334155;
            margin-left: 24px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--primary);
        }

        .btn-post {
            background-color: var(--primary);
            color: white !important;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-post:hover {
            background-color: #172554;
        }

        /* Hero Search Area */
        .hero {
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            color: white;
            padding: 80px 5%;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 35px;
            color: #94a3b8;
        }

        .search-wrapper {
            background-color: white;
            padding: 12px;
            border-radius: 8px;
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .search-wrapper input, .search-wrapper select {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            color: var(--dark);
            outline: none;
        }

        .search-wrapper input:focus, .search-wrapper select:focus {
            border-color: var(--primary);
        }

        .search-wrapper button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 32px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-wrapper button:hover {
            background-color: #991b1b;
        }

        /* Layout Grid Container */
        .main-layout {
            max-width: 1250px;
            margin: 48px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 32px;
        }

        @media (max-width: 912px) {
            .search-wrapper { flex-direction: column; }
            .main-layout { grid-template-columns: 1fr; }
        }

        /* Sidebar Control Center */
        .sidebar {
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            height: fit-content;
        }

        .filter-section {
            margin-bottom: 28px;
        }

        .filter-section h3 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            color: #334155;
        }

        /* Job Stream Listings */
        .listings-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .job-card {
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .job-card:hover {
            border-color: #94a3b8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .job-badge {
            display: inline-block;
            background-color: #fee2e2;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .job-title {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .company {
            font-weight: 600;
            color: #334155;
            margin-bottom: 12px;
        }

        .metadata-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 16px;
        }

        .pill {
            background-color: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            color: #475569;
        }

        .paycheck {
            color: var(--success);
            font-weight: 600;
        }

        .summary {
            color: #475569;
            font-size: 0.95rem;
            max-width: 85%;
        }

        .btn-view {
            position: absolute;
            right: 24px;
            bottom: 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-view:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 640px) {
            .btn-view { position: static; display: block; margin-top: 16px; width: 100%; text-align: center; }
            .summary { max-width: 100%; }
        }
    </style>
</head>

                <label class="filter-checkbox"><input type="checkbox"> Seattle, WA</label>
            </div>
        </aside>
